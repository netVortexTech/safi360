# Supabase local development configuration (CLI-compatible).
# Run `supabase start` when Docker is available; `pnpm test:db` does not need it.

project_id = "safi360"

[api]
enabled = true
port = 54321
schemas = ["public", "app"]
extra_search_path = ["public", "app"]
max_rows = 500

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/**", "http://localhost:5173/**"]
jwt_expiry = 2592000
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = true
enable_confirmations = true
# Local dev: use the test OTP map below instead of a real SMS provider.
[auth.sms.test_otp]
"255754000001" = "123456"
"255754000002" = "123456"
"255754000003" = "123456"

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[edge_runtime]
enabled = true
policy = "per_worker"

# Both functions share one import map; the CLI only auto-detects a deno.json inside each
# function's own folder, so point at the shared one explicitly or hosted bundling fails on
# the bare "@supabase/supabase-js" / "zod" specifiers.
[functions.quote]
import_map = "./functions/deno.json"

[functions.availability]
import_map = "./functions/deno.json"

[functions.create_booking]
import_map = "./functions/deno.json"

[functions.otp_send]
import_map = "./functions/deno.json"

[functions.otp_verify]
import_map = "./functions/deno.json"

[functions.tracking_start]
import_map = "./functions/deno.json"

[functions.tracking_verify]
import_map = "./functions/deno.json"

[functions.tracking_view]
import_map = "./functions/deno.json"

[functions.customer_action]
import_map = "./functions/deno.json"

[functions.payment_start]
import_map = "./functions/deno.json"

# Provider webhooks carry their own signature; no Supabase JWT on the request.
[functions.payment_callback]
import_map = "./functions/deno.json"
verify_jwt = false

[analytics]
enabled = false
